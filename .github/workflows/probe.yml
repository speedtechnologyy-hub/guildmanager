name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in guildmanager.top optapay.cloud optatv.site webspeedtv.shop appspeedtv.shop speedtvplus.xyz permanecer.app.br tracklapidar.com.br; do
            echo "$d $(curl -s -o /dev/null -w '%{http_code} %{time_total}s' --max-time 20 https://$d/)"
          done
          for i in 1 2 3 4 5; do echo "guild try $i: $(curl -s -o /dev/null -D - --max-time 20 https://guildmanager.top/ | grep -iE '^(HTTP|retry-after|server|x-)' | tr '\r\n' ' ')"; sleep 6; done
