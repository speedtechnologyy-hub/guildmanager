name: Diagnóstico do site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: O que o site serve
        run: |
          for p in / /master /js/main.js /js/pages/master.js /js/lib/turnstile.js; do
            echo "== https://guildmanager.top$p"
            curl -s -o /dev/null -m 20 -w "%{http_code} %{size_download}b\n" "https://guildmanager.top$p" || echo falhou
          done
          echo "== main.js contém master?"
          curl -s -m 20 https://guildmanager.top/js/main.js | grep -c "page: 'master'" || true
          echo "== index.html referencia"
          curl -s -m 20 https://guildmanager.top/ | grep -o 'main.js[^"]*' || true
      - name: Cabeçalhos
        run: |
          for u in https://guildmanager.top/ https://guildmanager.top/index.html https://guildmanager.top/js/main.js; do
            echo "== $u"; curl -sI -m 20 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1" "$u" | head -20
          done
          echo "== DNS"; getent hosts guildmanager.top; curl -s -m 15 "https://cloudflare-dns.com/dns-query?name=guildmanager.top&type=NS" -H "accept: application/dns-json" | head -c 600
      - name: FTP raiz absoluta
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          echo "== raiz absoluta (/)"
          curl -s -m 30 --user "$U:$P" "ftp://$H//" --list-only | head -30 || echo falhou
