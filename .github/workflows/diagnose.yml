name: Diagnóstico do site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: FTP por dentro
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          echo "usuário em uso (mascarado pelo GitHub como ***), tamanho: ${#U}"
          echo "== PWD e listagem longa da raiz"
          curl -sv -m 30 --user "$U:$P" "ftp://$H/" -Q "PWD" 2>&1 | grep -E "^< (257|2[0-9][0-9] )|drw|^-|rw" | sed "s/$U/USER/g" | head -40
          echo "== tenta subir um nível"
          curl -s -m 30 --user "$U:$P" "ftp://$H/../" --list-only | head -20 || echo falhou
          echo "== existe default.php na raiz?"
          curl -s -m 30 --user "$U:$P" "ftp://$H/" --list-only | grep -c "default.php" || true
          echo "== existe public_html dentro da raiz?"
          curl -s -m 30 --user "$U:$P" "ftp://$H/" --list-only | grep -x "public_html" || echo "não"
