name: Teste do site no ar

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tempos de resposta
        run: |
          K=sb_publishable_MPsKLkP6O15TGIFrOlYgAQ_vdO5E37G
          U=https://uhlmxifsozrjajkghqql.supabase.co
          t() { curl -s -o /tmp/o -m 30 -w "%{http_code} %{time_total}s %{size_download}b  $1\n" "${@:2}" "$1" || echo "FALHOU $1"; }
          t https://guildmanager.top/
          M=$(curl -s https://guildmanager.top/ | grep -o 'v/[^"]*app.js' | head -1 || true); echo "app: $M"
          curl -sI "https://guildmanager.top/$M" | grep -i "HTTP/\|cache-control\|content-type\|content-length" || true
          curl -sI "https://guildmanager.top/${M/app.js/app.css}" | grep -i "HTTP/\|cache-control" || true
          curl -sI https://guildmanager.top/ | grep -i "HTTP/\|cache-control" || true
          t "$U/rest/v1/site_settings?select=key" -H "apikey: $K"
      - name: Abrir o site em navegador de verdade
        run: |
          cd .github/diag && npm init -y >/dev/null && npm i playwright 2>&1 | tail -3
          npx playwright install --with-deps chromium webkit 2>&1 | tail -5
          node check.mjs
