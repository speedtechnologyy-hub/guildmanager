name: Deploy para Hostinger

on:
  # Por enquanto só manual: GitHub > Actions > "Deploy para Hostinger" > Run workflow.
  workflow_dispatch:
  # Publica automaticamente a cada push na main:
  push:
    branches: [main]

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O servidor limita a quantidade de pedidos por minuto (erro 429). Para o navegador não pedir
      # os mesmos arquivos de novo a cada visita, JS e CSS vão para uma pasta com o número da versão
      # e ficam guardados no aparelho. Só o index.html é conferido a cada acesso.
      - name: Publicar JS e CSS em pasta versionada (cache longo)
        run: |
          V=$(date +%Y%m%d%H%M)-${GITHUB_SHA::7}
          mkdir -p "v/$V"
          mv js css "v/$V/"
          sed -i -E "s#(href|src)=\"(js|css)/#\\1=\"v/$V/\\2/#g" index.html
          printf '<IfModule mod_headers.c>\n  <FilesMatch "\\.(js|css)$">\n    Header set Cache-Control "public, max-age=31536000, immutable"\n  </FilesMatch>\n</IfModule>\n' > v/.htaccess
          grep -n 'v/' index.html | head -5; cat v/.htaccess

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          state-name: .ftp-deploy-sync-state-v3.json
          port: 21
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            supabase/**
            **/*.md
            node_modules/**
