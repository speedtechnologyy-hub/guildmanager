name: Deploy para Hostinger

on:
  # Por enquanto só manual: GitHub > Actions > "Deploy para Hostinger" > Run workflow.
  workflow_dispatch:
  # Publica automaticamente a cada push na main:
  push:
    branches: [main]

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Carimbar versão nos arquivos (evita cache antigo)
        run: |
          V=$(date +%Y%m%d%H%M)-${GITHUB_SHA::7}
          grep -rlE '\?v=2026[0-9a-z]+' js index.html | xargs sed -i -E "s/\?v=2026[0-9a-z]+/?v=$V/g"

      - name: Enviar por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          state-name: .ftp-deploy-sync-state-v3.json
          port: 21
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            supabase/**
            **/*.md
            node_modules/**
